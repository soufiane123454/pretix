
name: Pretix CI/CD

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:

  # ==========================================
  # JOB 1 : TEST
  # ==========================================
  test:
    name: Run Pretix Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gettext \
            git \
            libffi-dev \
            libssl-dev \
            libxml2-dev \
            libxslt1-dev

      
      - name: Install Pretix development dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -e ".[dev]"

      - name: Prepare Pretix assets and translations
        working-directory: src
        run: make all compress

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run automated tests
        working-directory: src
        run: py.test



  # ==========================================
  # JOB 2 : BUILD DOCKER IMAGE
  # ==========================================
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          IMAGE="${IMAGE_NAME}"

          docker build \
            -f Dockerfile.devops \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:${GITHUB_SHA}" \
            .

      - name: Export Docker image
        run: |
          docker save \
            "${IMAGE_NAME}:latest" \
            "${IMAGE_NAME}:${GITHUB_SHA}" \
            -o pretix-image.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: pretix-docker-image
          path: pretix-image.tar
          retention-days: 1


  # ==========================================
  # JOB 3 : PUSH TO GHCR
  # ==========================================
  push:
    name: Push Image to GHCR
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: pretix-docker-image

      - name: Load Docker image
        run: docker load -i pretix-image.tar

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        run: |
          docker push "${IMAGE_NAME}:latest"
          docker push "${IMAGE_NAME}:${GITHUB_SHA}"


  deploy:
    name: Deploy Rehearsal
    runs-on: ubuntu-latest
    needs: push

    permissions:
      packages: read

    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Docker image
        run: |
          docker pull "${IMAGE_NAME}:${GITHUB_SHA}"

      - name: Verify Pretix image
        run: |
          docker run --rm \
            --entrypoint python \
            "${IMAGE_NAME}:${GITHUB_SHA}" \
            -c "import pretix; print('Pretix image is ready')"

  

  # ==========================================
  # JOB 5 : AUTOMATED STAGING DEPLOYMENT
  # ==========================================
  deploy-staging:
    name: Deploy Pretix Staging
    runs-on: ubuntu-latest
    needs: push

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Pretix image
        run: docker pull "${IMAGE_NAME}:${GITHUB_SHA}"

      - name: Generate staging configuration
        shell: bash
        run: |
          umask 077
          DB_PASSWORD="$(openssl rand -hex 24)"

          printf 'PRETIX_IMAGE=%s\nPOSTGRES_PASSWORD=%s\n' \
            "${IMAGE_NAME}:${GITHUB_SHA}" \
            "$DB_PASSWORD" > .env.staging

          mkdir -p config

          cat > config/pretix.staging.cfg <<EOF
          [pretix]
          instance_name=Pretix CI Staging
          url=http://localhost:8081
          datadir=/data

          [database]
          backend=postgresql
          name=pretix
          user=pretix
          password=$DB_PASSWORD
          host=postgres
          port=5432

          [redis]
          location=redis://redis:6379/0
          sessions=true

          [celery]
          broker=redis://redis:6379/1
          backend=redis://redis:6379/2
          EOF

      - name: Validate staging configuration
        run: |
          docker compose --env-file .env.staging \
            -f docker-compose-staging.yml config -q

      - name: Start PostgreSQL and Redis
        run: |
          docker compose --env-file .env.staging \
            -f docker-compose-staging.yml \
            up -d postgres redis

      - name: Wait for PostgreSQL and Redis
        shell: bash
        run: |
          for service in postgres redis; do
            echo "Waiting for $service..."

            CID=$(docker compose --env-file .env.staging \
              -f docker-compose-staging.yml ps -q "$service")

            if [ -z "$CID" ]; then
              echo "Container $service not found"
              exit 1
            fi

            healthy=false

            for i in $(seq 1 30); do
              status=$(docker inspect \
                --format '{{.State.Health.Status}}' "$CID")

              if [ "$status" = "healthy" ]; then
                echo "$service is healthy"
                healthy=true
                break
              fi

              echo "$service: $status"
              sleep 2
            done

            if [ "$healthy" != "true" ]; then
              echo "$service did not become healthy"
              exit 1
            fi
          done

      - name: Run database migrations
        run: |
          docker compose --env-file .env.staging \
            -f docker-compose-staging.yml \
            run --rm --no-deps migrate

      - name: Start Pretix services
        run: |
          docker compose --env-file .env.staging \
            -f docker-compose-staging.yml \
            up -d --no-deps web worker nginx

      - name: Wait for Pretix HTTP response
        shell: bash
        run: |
          echo "Waiting for Pretix staging..."

          for i in $(seq 1 30); do
            STATUS=$(curl --silent --output /dev/null \
              --write-out "%{http_code}" \
              --max-time 5 \
              http://localhost:8081/ || true)

            if [ "$STATUS" = "200" ]; then
              echo "Pretix staging is responding: HTTP 200"
              exit 0
            fi

            echo "Attempt $i: HTTP $STATUS"
            sleep 5
          done

          echo "Pretix staging did not become ready"
          exit 1

      - name: Verify staging containers
        shell: bash
        run: |
          docker compose --env-file .env.staging \
            -f docker-compose-staging.yml ps

          for service in postgres redis web worker nginx; do
            CID=$(docker compose --env-file .env.staging \
              -f docker-compose-staging.yml ps -q "$service")

            if [ -z "$CID" ] || \
               [ "$(docker inspect -f '{{.State.Running}}' "$CID")" != "true" ]; then
              echo "ERROR: $service is not running"
              exit 1
            fi

            echo "$service is running"
          done

      - name: Show staging logs on failure
        if: failure()
        run: |
          docker compose --env-file .env.staging \
            -f docker-compose-staging.yml \
            logs --tail=80 postgres redis migrate web worker nginx

            
  # ==========================================
  # JOB 6 : TRIGGER PRIVATE VM STAGING CD
  # ==========================================
  trigger-vm-staging:
    name: Trigger VM Staging Deployment
    runs-on: ubuntu-latest
    needs: [push, deploy-staging]

    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    permissions:
      contents: read

    steps:
      - name: Trigger private deployment workflow
        shell: bash
        env:
          DEPLOY_TOKEN: ${{ secrets.STAGING_DEPLOY_TOKEN }}
          IMAGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ -z "$DEPLOY_TOKEN" ]; then
            echo "ERROR: STAGING_DEPLOY_TOKEN is missing"
            exit 1
          fi

          echo "Triggering VM staging deployment"
          echo "Image commit: $IMAGE_SHA"

          jq -n \
            --arg sha "$IMAGE_SHA" \
            '{ref:"main",inputs:{image_sha:$sha}}' \
            > /tmp/deploy-payload.json

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${DEPLOY_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data @/tmp/deploy-payload.json \
            "https://api.github.com/repos/soufiane123454/pretix-staging-deploy/actions/workflows/deploy-vm-staging.yml/dispatches"

          echo "Private staging CD triggered successfully"



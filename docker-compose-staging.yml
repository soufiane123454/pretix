
name: pretix-staging

services:

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: pretix
      POSTGRES_USER: pretix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Password required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pretix-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pretix -d pretix"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - pretix-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    image: ${PRETIX_IMAGE:-pretix-devops:v1}
    restart: "no"
    command: ["python3", "-m", "pretix", "migrate", "--noinput"]
    volumes:
      - ./config/pretix.staging.cfg:/etc/pretix/pretix.cfg:ro
      - pretix_data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pretix-network

  web:
    image: ${PRETIX_IMAGE:-pretix-devops:v1}
    restart: unless-stopped
    volumes:
      - ./config/pretix.staging.cfg:/etc/pretix/pretix.cfg:ro
      - pretix_data:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - pretix-network

  worker:
    image: ${PRETIX_IMAGE:-pretix-devops:v1}
    restart: unless-stopped
    command: ["celery", "-A", "pretix.celery_app", "worker", "-l", "info"]
    volumes:
      - ./config/pretix.staging.cfg:/etc/pretix/pretix.cfg:ro
      - pretix_data:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - pretix-network

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ./deployment/devops/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    networks:
      - pretix-network

networks:
  pretix-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  pretix_data:
